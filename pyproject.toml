[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "automatic-workflow"
version = "0.1.0"
description = "Pipeline for transforming narratives into Wikidata-enriched storymaps and ontology artifacts."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "PlaceMUS" }
]
dependencies = [
  "beautifulsoup4==4.12.3",
  "json-repair==0.59.5",
  "langchain-community==0.4.1",
  "langchain-core==1.3.2",
  "requests==2.33.1",
]

[project.optional-dependencies]
dev = [
  "black==25.1.0",
  "coverage[toml]==7.6.12",
  "mypy==1.15.0",
  "pre-commit==4.1.0",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.6",
  "types-beautifulsoup4==4.12.0.20250516",
  "types-requests==2.32.4.20250913",
]
docs = [
  "mkdocs==1.6.1",
  "mkdocs-material==9.6.5",
]

[project.scripts]
automatic-workflow = "automatic_workflow.pipeline:main"
automatic-workflow-audit-triplify = "automatic_workflow.triplify_audit:main"

[tool.hatch.build.targets.wheel]
packages = ["src/automatic_workflow"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
warn_return_any = true
exclude = "(venv|M3-graph/Triplify)"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers --strict-config"
markers = [
  "integration: tests that exercise multiple workflow stages or external-like process boundaries",
]

[tool.coverage.run]
branch = true
source = ["automatic_workflow"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 75
